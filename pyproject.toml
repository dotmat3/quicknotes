[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quicknotes"
version = "0.1.0"
description = "Note rapide per meeting e giornate, in Markdown, consultabili da Claude via MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "mcp>=1.2",
    "pywebview>=5",
    "pystray>=0.19",
    "Pillow>=10",
    "Send2Trash>=1.8",
    "pynput>=1.7",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quicknotes = "quicknotes.__main__:main"

[project.gui-scripts]
quicknotes-gui = "quicknotes.__main__:main"

[tool.setuptools]
packages = ["quicknotes"]

[tool.setuptools.package-data]
quicknotes = ["webui/*.html", "webui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
