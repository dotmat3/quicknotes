[workspace]
members = ["crates/quicknotes-core", "crates/quicknotes-mcp", "crates/quicknotes-app"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.80"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# Le dipendenze restano ottimizzate anche in sviluppo: indicizzare con SQLite non ottimizzato falserebbe le prove.
[profile.dev.package."*"]
opt-level = 2
